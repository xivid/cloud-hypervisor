# Experimental fork-only measurement. Run from an isolated branch.
name: CVM boot KVM control
on:
  push:
    branches: ['bench/cvm-boot-kvm*']
permissions:
  contents: read
jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASELINE_SHA: f0bb0156951e55e26861a56dcac75b0a4f4789d3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check hardware and tools
        run: |
          set -eu
          test -c /dev/kvm
          lscpu
          free -h
          rustup update stable
          rustup override set stable
          rustc --version
      - name: Build both release VMMs
        run: |
          set -eux
          export CARGO_TARGET_DIR="$RUNNER_TEMP/ch-build"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASELINE_SHA"
          for source in "$RUNNER_TEMP/base" "$GITHUB_WORKSPACE"; do
            (cd "$source" && cargo +stable build --locked --release --bin cloud-hypervisor --no-default-features --features kvm,igvm,sev_snp,fw_cfg)
            install -m755 "$CARGO_TARGET_DIR/release/cloud-hypervisor" "$source/ch-measure"
          done
      - name: Prepare pinned direct-boot kernel and deterministic initramfs
        run: |
          set -eux
          curl --fail --location --retry 3 -o vmlinux https://github.com/cloud-hypervisor/linux/releases/download/ch-release-v7.2.8-20261009/vmlinux-x86_64
          echo 'edfeb8a8a6c04ff2979e9f1c700feaa29b8f564f952261834ef0b7d2e673a853  vmlinux' | sha256sum -c -
          python3 bench/make_initramfs.py --pad-mib 8 initramfs.gz
      - name: Boot six-vCPU eight-GiB guests to PID 1
        run: |
          sudo python3 bench/boot_bench.py --baseline "$RUNNER_TEMP/base/ch-measure" --candidate "$GITHUB_WORKSPACE/ch-measure" --kernel vmlinux --initramfs initramfs.gz --cpus 6 --memory-gib 8 --pairs 10 --output results
          cat results/summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Collect serial logs and samples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plain-kvm-boot
          path: results
          if-no-files-found: ignore
